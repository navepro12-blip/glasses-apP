name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_2*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build
        run: |
          set +e
          xcodebuild -project CameraAccess.xcodeproj -scheme CameraAccess \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > build.log 2>&1
          STATUS=$?
          tail -40 build.log
          grep -E "error:|warning: .*(Sendable|actor|isolat)" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          exit $STATUS
      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry NaveGlasses-1.0.${{ github.run_number }}.ipa Payload
          ls -lh NaveGlasses-*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NaveGlasses-v1.0.${{ github.run_number }}
          path: NaveGlasses-*.ipa
