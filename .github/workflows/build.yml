name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build
        run: |
          xcodebuild -project CameraAccess.xcodeproj -scheme CameraAccess \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -80
          test ${PIPESTATUS[0]} -eq 0
      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry NaveGlasses.ipa Payload
          ls -lh NaveGlasses.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NaveGlasses-ipa
          path: NaveGlasses.ipa
